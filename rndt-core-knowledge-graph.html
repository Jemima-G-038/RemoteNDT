<title>RNDT Core Graph</title>
<style>
  :root {
    --ground:#fbfaf7; --surface:#ffffff; --surface-2:#f4f2ea;
    --line:#e4e1d8; --line-soft:#efede4;
    --ink:#1a1a18; --ink-2:#3a3934; --ink-3:#57554c; --ink-4:#78766c; --ink-5:#9a9789;
    --accent:#a34a1e; --chip:#eeece2; --hover:#f0eee6;
    --sans:"IBM Plex Sans",-apple-system,"Segoe UI",sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Consolas,monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground:#191713; --surface:#211f1a; --surface-2:#262319;
      --line:#35322a; --line-soft:#2b2822;
      --ink:#f0ede4; --ink-2:#ded9cc; --ink-3:#c4bfb1; --ink-4:#a09a8b; --ink-5:#8f8a7c;
      --accent:#e08a5a; --chip:#2b2822; --hover:#2b2822;
    }
  }
  :root[data-theme="dark"] {
    --ground:#191713; --surface:#211f1a; --surface-2:#262319;
    --line:#35322a; --line-soft:#2b2822;
    --ink:#f0ede4; --ink-2:#ded9cc; --ink-3:#c4bfb1; --ink-4:#a09a8b; --ink-5:#8f8a7c;
    --accent:#e08a5a; --chip:#2b2822; --hover:#2b2822;
  }
  body { background: var(--ground); color: var(--ink); font-family: var(--sans); margin: 0; padding: 20px; }

  #kg-wrap { font-family: var(--sans); color: var(--ink); background: var(--ground); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; max-width: 1180px; margin: 0 auto; }
  #kg-header { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  #kg-header h2 { font-size: 15px; font-weight: 600; margin: 0; color: var(--ink); }
  #kg-header .kg-sub { font-size: 11.5px; color: var(--ink-4); font-family: var(--mono); }
  #kg-body { display: flex; }
  #kg-canvas-wrap { flex: 1; min-width: 0; position: relative; }
  #kg-svg { display: block; width: 100%; height: 580px; cursor: grab; }
  #kg-svg:active { cursor: grabbing; }
  #kg-side { width: 236px; flex-shrink: 0; border-left: 1px solid var(--line); padding: 14px; font-size: 12px; max-height: 580px; overflow-y: auto; }
  #kg-side h3 { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-5); margin: 0 0 8px; font-weight: 600; }
  .kg-legend-row { display: flex; align-items: center; gap: 7px; padding: 3px 0; cursor: pointer; user-select: none; border-radius: 6px; color: var(--ink-2); }
  .kg-legend-row:hover { background: var(--hover); }
  .kg-legend-row.kg-off { opacity: .35; }
  .kg-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .kg-legend-label { flex: 1; }
  .kg-legend-count { color: var(--ink-5); font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .kg-edge-row { display: flex; align-items: center; gap: 7px; padding: 2px 0; font-size: 11px; color: var(--ink-3); }
  .kg-edge-swatch { width: 16px; height: 0; border-top-width: 2px; border-top-style: solid; flex-shrink: 0; }
  #kg-detail { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); min-height: 70px; }
  #kg-detail .kg-empty { color: var(--ink-5); font-size: 12px; }
  #kg-detail .kg-name { font-size: 13px; font-weight: 600; margin: 0 0 3px; color: var(--ink); }
  #kg-detail .kg-type { font-size: 11px; color: var(--ink-4); margin: 0 0 6px; }
  #kg-detail .kg-term { display: inline-block; font-size: 10px; font-family: var(--mono); background: var(--chip); color: var(--ink-3); padding: 1px 6px; border-radius: 4px; margin-bottom: 8px; }
  #kg-detail .kg-conn-label { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-5); margin: 8px 0 3px; }
  #kg-detail .kg-conn { font-size: 11.5px; color: var(--ink-2); padding: 2px 0; cursor: pointer; }
  #kg-detail .kg-conn:hover { color: var(--accent); }
  #kg-detail .kg-conn .kg-rel { color: var(--ink-5); font-family: var(--mono); }
  #kg-controls { padding: 8px 18px; border-top: 1px solid var(--line); display: flex; gap: 14px; align-items: center; font-size: 11.5px; color: var(--ink-4); flex-wrap: wrap; }
  #kg-controls button { font-size: 11.5px; padding: 4px 10px; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; cursor: pointer; color: var(--ink-2); font-family: var(--sans); }
  #kg-controls button:hover { background: var(--hover); }
  .kg-node text { pointer-events: none; font-size: 9px; fill: var(--ink-2); font-family: var(--sans); }
  .kg-node.kg-dim { opacity: .12; }
  .kg-link.kg-dim { opacity: .06; }
  .kg-node.kg-dim text { display: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (max-width: 640px) {
    #kg-body { flex-direction: column; }
    #kg-side { width: auto; border-left: none; border-top: 1px solid var(--line); max-height: 260px; }
    #kg-svg { height: 440px; }
  }
</style>

<div id="kg-wrap">
  <div id="kg-header">
    <h2>RNDT core ontology — knowledge graph</h2>
    <span class="kg-sub">102 individuals &middot; 122 relationships &middot; 8 populated classes &middot; method-agnostic</span>
  </div>
  <div id="kg-body">
    <div id="kg-canvas-wrap">
      <svg id="kg-svg"></svg>
    </div>
    <div id="kg-side">
      <h3>Node types</h3>
      <div id="kg-legend"></div>
      <h3 style="margin-top:14px">Relationships</h3>
      <div id="kg-edge-legend"></div>
      <div id="kg-detail"><div class="kg-empty">Click any node to inspect it and trace its connections.</div></div>
    </div>
  </div>
  <div id="kg-controls">
    <button id="kg-reset">Reset view</button>
    <button id="kg-clear">Clear selection</button>
    <span>Drag nodes &middot; scroll to zoom &middot; click a node to trace connections</span>
  </div>
</div>

ion","module":"core"},{"source":"PersonnelAndAuthorityRecords","target":"MaintainRoleAndAuthorityRecords","rel":"requiresAction","module":"core"},{"source":"PowerUpEquipment","target":"Operator","rel":"performedBy","module":"core"},{"source":"ProcedureAndWorkInstructionControl","target":"PrepareRNDTProcedure","rel":"requiresAction","module":"core"},{"source":"ProcessReassessment","target":"ReassessVerificationModel","rel":"requiresAction","module":"core"},{"source":"ProcessReassessment","target":"UpdateProcedureOrWorkInstruction","rel":"requiresAction","module":"core"},{"source":"RegulatoryAndPersonnelCompliance","target":"ConfirmComplianceNANDTB29","rel":"requiresAction","module":"core"},{"source":"RegulatoryAndPersonnelCompliance","target":"VerifyPersonnelTraining","rel":"requiresAction","module":"core"},{"source":"ReviewAttachedEvidence","target":"Inspector","rel":"performedBy","module":"core"},{"source":"ReviewInspectionPackage","target":"Inspector","rel":"performedBy","module":"core"},{"source":"RiskQMSAndSecurityAssurance","target":"AssureElectronicSignatureSecurity","rel":"requiresAction","module":"core"},{"source":"RiskQMSAndSecurityAssurance","target":"ReviewAndApproveRNDTTaskRiskAssessment","rel":"requiresAction","module":"core"},{"source":"SelectComponent","target":"Operator","rel":"performedBy","module":"core"},{"source":"Sense","target":"Level1InspectionExecutionAuthority","rel":"authorisedBy","module":"core"},{"source":"Sense","target":"AcquiredDataQualityAssessmentL1","rel":"hasSubActivity","module":"core"},{"source":"Sense","target":"EquipmentStatusMonitoring","rel":"hasSubActivity","module":"core"},{"source":"Sense","target":"InspectionEnviroment","rel":"hasSubActivity","module":"core"},{"source":"Sense","target":"SetupVerification","rel":"hasSubActivity","module":"core"},{"source":"Sentence","target":"Level2TechnicalEvaluationAuthority","rel":"authorisedBy","module":"core"},{"source":"Sentence","target":"Documentation","rel":"hasSubActivity","module":"core"},{"source":"Sentence","target":"InspectionDisposition","rel":"hasSubActivity","module":"core"},{"source":"SetupVerification","target":"ObserveEnergySourcePosition","rel":"requiresAction","module":"core"},{"source":"SetupVerification","target":"ObserveSensorPosition","rel":"requiresAction","module":"core"},{"source":"StoreAcquiredData","target":"Operator","rel":"performedBy","module":"core"},{"source":"TechnicalInterpretation","target":"IdentifyIndications","rel":"requiresAction","module":"core"},{"source":"TechnologyAndChangeControl","target":"ValidateNewEquipment","rel":"requiresAction","module":"core"},{"source":"TechnologyAndChangeControl","target":"ValidateNewSoftware","rel":"requiresAction","module":"core"},{"source":"TransferAcquiredData","target":"Operator","rel":"performedBy","module":"core"},{"source":"VerificationModelAndTechnicalApproval","target":"ApproveTechnicalValidation","rel":"requiresAction","module":"core"},{"source":"VerificationModelAndTechnicalApproval","target":"SelectVerificationModel","rel":"requiresAction","module":"core"},{"source":"Verify","target":"Level2TechnicalEvaluationAuthority","rel":"authorisedBy","module":"core"},{"source":"Verify","target":"InspectionReadiness","rel":"hasSubActivity","module":"core"},{"source":"VerifyAcceptanceCriteria","target":"Verifier","rel":"performedBy","module":"core"},{"source":"VerifyComponentIdentityL1","target":"Operator","rel":"performedBy","module":"core"},{"source":"VerifyImageProvenance","target":"Verifier","rel":"performedBy","module":"core"},{"source":"VerifyInspectionRequest","target":"Verifier","rel":"performedBy","module":"core"}]};

  const typeColor = {
    ProcessStage: "#185fa5",
    MajorAction: "#378add",
    ActionArea: "#5dcaa5",
    Activity: "#0f6e56",
    Capability: "#ef9f27",
    RequirementConcept: "#ba7517",
    InformationEntity: "#993c1d",
    AuthorityClass: "#7f77dd",
    Participant: "#534ab7"
  };
  const typeOrder = ["ProcessStage","MajorAction","ActionArea","Activity","Capability","RequirementConcept","InformationEntity","AuthorityClass","Participant"];
  const typeRadius = { ProcessStage: 10, MajorAction: 8, ActionArea: 7, AuthorityClass: 8, Participant: 8, Activity: 5, Capability: 6, RequirementConcept: 6, InformationEntity: 6 };

  const relGroups = {
    "backbone (taxonomy)": { rels: ["hasProcessStage","realisedThrough","hasSubActivity","requiresAction","requiresCapability","hasRequirement"], color: "#8d8878", dash: "0" },
    "authority": { rels: ["authorisedBy","associatedWithAuthority"], color: "#7f77dd", dash: "0" },
    "role": { rels: ["performedBy"], color: "#534ab7", dash: "3,2" },
    "evidence / info": { rels: ["producesEvidence","usesInformation"], color: "#d85a30", dash: "3,2" },
    "sequence": { rels: ["precedes"], color: "#0f6e56", dash: "1,3" }
  };
  const relToGroup = {};
  Object.entries(relGroups).forEach(([g, def]) => def.rels.forEach(r => relToGroup[r] = g));

  const nodeById = new Map(data.nodes.map(n => [n.id, n]));
  const neighbors = new Map(data.nodes.map(n => [n.id, new Set()]));
  const nodeEdges = new Map(data.nodes.map(n => [n.id, []]));
  data.edges.forEach(e => {
    neighbors.get(e.source).add(e.target);
    neighbors.get(e.target).add(e.source);
    nodeEdges.get(e.source).push(e);
    nodeEdges.get(e.target).push(e);
  });

  const activeTypes = new Set(typeOrder);
  let selected = null;

  const svg = d3.select("#kg-svg");
  const wrap = document.getElementById("kg-canvas-wrap");
  let width = wrap.clientWidth, height = 580;

  const g = svg.append("g");
  const zoomBehavior = d3.zoom().scaleExtent([0.06, 6]).on("zoom", (ev) => g.attr("transform", ev.transform));
  svg.call(zoomBehavior);

  // A 100+ node force layout naturally spreads well past the canvas at 1:1 —
  // this fits either the whole graph or a given node subset into view instead
  // of leaving stray nodes outside the visible area.
  function fitToView(ids, duration) {
    const pts = ids ? data.nodes.filter(n => ids.has(n.id)) : data.nodes;
    if (!pts.length) return;
    const x0 = Math.min(...pts.map(p => p.x)), x1 = Math.max(...pts.map(p => p.x));
    const y0 = Math.min(...pts.map(p => p.y)), y1 = Math.max(...pts.map(p => p.y));
    const pad = 50;
    const bw = Math.max(x1 - x0, 20) + pad * 2, bh = Math.max(y1 - y0, 20) + pad * 2;
    const scale = Math.max(0.06, Math.min(4, Math.min(width / bw, height / bh)));
    const transform = d3.zoomIdentity
      .translate(width / 2, height / 2)
      .scale(scale)
      .translate(-(x0 + x1) / 2, -(y0 + y1) / 2);
    svg.transition().duration(duration ?? 0).call(zoomBehavior.transform, transform);
  }

  const simulation = d3.forceSimulation(data.nodes)
    .force("link", d3.forceLink(data.edges).id(d => d.id).distance(d => relToGroup[d.rel] === "backbone (taxonomy)" ? 46 : 70).strength(0.5))
    .force("charge", d3.forceManyBody().strength(-140))
    .force("center", d3.forceCenter(width / 2, height / 2))
    .force("collide", d3.forceCollide().radius(d => (typeRadius[d.type] || 6) + 14));

  const link = g.append("g").selectAll("line")
    .data(data.edges).join("line")
    .attr("class", "kg-link")
    .attr("stroke", d => relGroups[relToGroup[d.rel]].color)
    .attr("stroke-dasharray", d => relGroups[relToGroup[d.rel]].dash)
    .attr("stroke-width", 1)
    .attr("stroke-opacity", 0.55);

  const node = g.append("g").selectAll("g")
    .data(data.nodes).join("g")
    .attr("class", "kg-node")
    .style("cursor", "pointer")
    .call(d3.drag()
      .on("start", (ev, d) => { if (!ev.active) simulation.alphaTarget(0.2).restart(); d.fx = d.x; d.fy = d.y; })
      .on("drag", (ev, d) => { d.fx = ev.x; d.fy = ev.y; })
      .on("end", (ev, d) => { if (!ev.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; }));

  // Invisible, larger hit-circle under every node so a small 5-8px dot still
  // has a comfortably clickable target (mouse and touch alike).
  node.append("circle")
    .attr("r", d => (typeRadius[d.type] || 6) + 10)
    .attr("fill", "transparent")
    .attr("pointer-events", "all");

  node.append("circle")
    .attr("r", d => typeRadius[d.type] || 6)
    .attr("fill", d => typeColor[d.type])
    .attr("stroke", "var(--ground)")
    .attr("stroke-width", 1.5)
    .attr("pointer-events", "none");

  node.append("text")
    .attr("x", d => (typeRadius[d.type] || 6) + 4)
    .attr("y", 3)
    .text(d => d.label.length > 26 ? d.label.slice(0, 24) + "…" : d.label);

  node.on("click", (ev, d) => { ev.stopPropagation(); selectNode(d.id); });
  svg.on("click", () => selectNode(null));

  simulation.on("tick", () => {
    link.attr("x1", d => d.source.x).attr("y1", d => d.source.y)
        .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
    node.attr("transform", d => `translate(${d.x},${d.y})`);
  });

  function applyFilter() {
    node.classed("kg-dim", d => !activeTypes.has(d.type));
    link.classed("kg-dim", d => !activeTypes.has(nodeById.get(d.source.id || d.source).type) || !activeTypes.has(nodeById.get(d.target.id || d.target).type));
  }

  function selectNode(id) {
    selected = id;
    const detail = document.getElementById("kg-detail");
    if (!id) {
      applyFilter();
      detail.innerHTML = '<div class="kg-empty">Click any node to inspect it and trace its connections.</div>';
      return;
    }
    const ns = neighbors.get(id);
    node.classed("kg-dim", d => d.id !== id && !ns.has(d.id));
    link.classed("kg-dim", d => (d.source.id || d.source) !== id && (d.target.id || d.target) !== id);

    const n = nodeById.get(id);
    const edges = nodeEdges.get(id).map(e => {
      const outgoing = (e.source.id || e.source) === id;
      const otherId = outgoing ? (e.target.id || e.target) : (e.source.id || e.source);
      const other = nodeById.get(otherId);
      return { rel: e.rel, outgoing, other };
    }).sort((a, b) => a.rel.localeCompare(b.rel));

    let html = `<p class="kg-name">${n.label}</p><p class="kg-type">${n.type}</p>`;
    if (n.termId) html += `<span class="kg-term">${n.termId}</span>`;
    html += `<div class="kg-conn-label">${edges.length} connection${edges.length === 1 ? '' : 's'}</div>`;
    edges.forEach(e => {
      html += `<div class="kg-conn" data-id="${e.other.id}">${e.outgoing ? '→' : '←'} <span class="kg-rel">${e.rel}</span> ${e.other.label}</div>`;
    });
    detail.innerHTML = html;
    detail.querySelectorAll(".kg-conn").forEach(el => {
      el.addEventListener("click", () => selectNode(el.dataset.id));
    });
  }

  const counts = {};
  data.nodes.forEach(n => counts[n.type] = (counts[n.type] || 0) + 1);
  const legend = document.getElementById("kg-legend");
  typeOrder.forEach(t => {
    if (!counts[t]) return;
    const row = document.createElement("div");
    row.className = "kg-legend-row";
    row.innerHTML = `<span class="kg-dot" style="background:${typeColor[t]}"></span><span class="kg-legend-label">${t}</span><span class="kg-legend-count">${counts[t]}</span>`;
    row.addEventListener("click", () => {
      if (activeTypes.has(t)) { activeTypes.delete(t); row.classList.add("kg-off"); }
      else { activeTypes.add(t); row.classList.remove("kg-off"); }
      selected = null;
      applyFilter();
      document.getElementById("kg-detail").innerHTML = '<div class="kg-empty">Click any node to inspect it and trace its connections.</div>';
    });
    legend.appendChild(row);
  });

  const edgeCounts = {};
  data.edges.forEach(e => edgeCounts[relToGroup[e.rel]] = (edgeCounts[relToGroup[e.rel]] || 0) + 1);
  const edgeLegend = document.getElementById("kg-edge-legend");
  Object.entries(relGroups).forEach(([g2, def]) => {
    const row = document.createElement("div");
    row.className = "kg-edge-row";
    row.innerHTML = `<span class="kg-edge-swatch" style="border-top-color:${def.color};border-top-style:${def.dash === "0" ? "solid" : "dashed"}"></span><span>${g2} (${edgeCounts[g2] || 0})</span>`;
    edgeLegend.appendChild(row);
  });

  document.getElementById("kg-reset").addEventListener("click", () => fitToView(null, 400));
  document.getElementById("kg-clear").addEventListener("click", () => selectNode(null));

  let settled = false;
  simulation.on("end", () => { if (!settled) { settled = true; fitToView(null, 500); } });

  new ResizeObserver(() => {
    const w = wrap.clientWidth;
    if (Math.abs(w - width) > 20) {
      width = w;
      simulation.force("center", d3.forceCenter(width / 2, height / 2));
      simulation.alpha(0.3).restart();
    }
  }).observe(wrap);
})();
</script>
